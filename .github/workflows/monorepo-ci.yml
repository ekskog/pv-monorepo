name: Monorepo CI Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: pv-spa
            path: pv-spa
            context: pv-spa
            image: ghcr.io/ekskog/pv-spa
            deployment: pv-spa
            container: pv-spa
            manifests_dir: k8s/base/pv-spa
          - name: pv-api
            path: pv-api
            context: pv-api
            image: ghcr.io/ekskog/pv-api
            deployment: pv-api
            container: pv-api
            manifests_dir: k8s/base/pv-api
          - name: pv-converter
            path: pv-converter
            context: pv-converter
            image: ghcr.io/ekskog/pv-converter
            deployment: pv-avif-converter
            container: pv-avif-converter
            manifests_dir: k8s/base/pv-converter
          - name: pv-temporal-worker
            path: pv-temporal-worker
            context: pv-temporal-worker/worker
            image: ghcr.io/ekskog/pv-worker
            deployment: pv-worker
            container: worker
            manifests_dir: k8s/base/pv-temporal-worker
          - name: pv-uploader
            path: pv-uploader
            context: pv-uploader
            image: ghcr.io/ekskog/pv-uploader
            deployment: ""
            container: ""
            manifests_dir: k8s/base/pv-uploader

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history avoids false negatives in git diff on runners.
          fetch-depth: 0

      - name: Determine if service changed
        id: changed
        run: |
          echo "Checking for changes under '${{ matrix.path }}'"
          CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || git show --pretty='' --name-only "${{ github.sha }}" || true)
          echo "files_changed<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if echo "$CHANGED_FILES" | grep -E "^${{ matrix.path }}(/|$)" >/dev/null; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

          # Check for manifest changes related to this specific service
          if echo "$CHANGED_FILES" | grep -E "^k8s/base/${{ matrix.name }}(/|$)" >/dev/null || \
             echo "$CHANGED_FILES" | grep -E "^${{ matrix.path }}/k8s(/|$)" >/dev/null; then
            echo "manifests_changed=true" >> $GITHUB_OUTPUT
          else
            echo "manifests_changed=false" >> $GITHUB_OUTPUT
          fi

          # Dependency trigger: pv-worker consumes shared API runtime inputs.
          # Restart worker when API source or API k8s manifests change.
          if echo "$CHANGED_FILES" | grep -E "^(pv-api/|k8s/base/pv-api/)" >/dev/null; then
            echo "api_related_changed=true" >> $GITHUB_OUTPUT
          else
            echo "api_related_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set short SHA
        id: vars
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Check deploy prerequisites
        id: deploy
        if: steps.changed.outputs.changed == 'true' || steps.changed.outputs.manifests_changed == 'true' || (matrix.name == 'pv-temporal-worker' && steps.changed.outputs.api_related_changed == 'true')
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -n "$KUBECONFIG_SECRET" ]; then
            echo "has_kubeconfig=true" >> $GITHUB_OUTPUT
          else
            echo "has_kubeconfig=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip if no changes
        if: steps.changed.outputs.changed == 'false' && !(matrix.name == 'pv-temporal-worker' && steps.changed.outputs.api_related_changed == 'true')
        run: echo "No changes for ${{ matrix.name }}; skipping build"

      - name: Set up Docker Buildx
        if: steps.changed.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.changed.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.EK_GITHUB_PAT }}

      - name: Build and push image
        if: steps.changed.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ steps.vars.outputs.short_sha }}
            ${{ matrix.image }}:latest

      - name: Skip deploy when kubeconfig missing
        if: (steps.changed.outputs.changed == 'true' || steps.changed.outputs.manifests_changed == 'true' || (matrix.name == 'pv-temporal-worker' && steps.changed.outputs.api_related_changed == 'true')) && steps.deploy.outputs.has_kubeconfig == 'false'
        run: echo "KUBECONFIG secret not provided; skipping deploy for ${{ matrix.name }}"

      - name: Prepare kubeconfig
        if: (steps.changed.outputs.changed == 'true' || steps.changed.outputs.manifests_changed == 'true' || (matrix.name == 'pv-temporal-worker' && steps.changed.outputs.api_related_changed == 'true')) && steps.deploy.outputs.has_kubeconfig == 'true'
        run: |
          # Support either base64 kubeconfig or raw kubeconfig content.
          if echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig.yaml 2>/dev/null; then
            echo "Decoded base64 kubeconfig"
          else
            echo "Using raw kubeconfig content"
            printf '%s' "${{ secrets.KUBECONFIG }}" > kubeconfig.yaml
          fi
          echo "KUBECONFIG=$PWD/kubeconfig.yaml" >> $GITHUB_ENV
          kubectl --kubeconfig=kubeconfig.yaml version --client

      - name: Create or update image pull secret
        if: (steps.changed.outputs.changed == 'true' || steps.changed.outputs.manifests_changed == 'true' || (matrix.name == 'pv-temporal-worker' && steps.changed.outputs.api_related_changed == 'true')) && steps.deploy.outputs.has_kubeconfig == 'true'
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password="${{ secrets.EK_GITHUB_PAT }}" \
            --namespace=pv \
            --kubeconfig=kubeconfig.yaml \
            --dry-run=client -o yaml | kubectl apply -f - --kubeconfig=kubeconfig.yaml

      - name: Create or update runtime app secret
        id: runtime_app_secret
        if: (steps.changed.outputs.changed == 'true' || steps.changed.outputs.manifests_changed == 'true') && steps.deploy.outputs.has_kubeconfig == 'true' && (matrix.name == 'pv-api' || matrix.name == 'pv-temporal-worker')
        env:
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          required_vars=(
            MINIO_ACCESS_KEY
            MINIO_SECRET_KEY
            MAPBOX_TOKEN
            JWT_SECRET
            TURNSTILE_SECRET_KEY
            DB_PASSWORD
          )

          missing=0
          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${var_name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Required secrets are missing. Refusing to update pv-api-secret with partial values."
            exit 1
          fi

          kubectl create secret generic pv-api-secret \
            --from-literal=MINIO_ACCESS_KEY="$MINIO_ACCESS_KEY" \
            --from-literal=MINIO_SECRET_KEY="$MINIO_SECRET_KEY" \
            --from-literal=MAPBOX_TOKEN="$MAPBOX_TOKEN" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=TURNSTILE_SECRET_KEY="$TURNSTILE_SECRET_KEY" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --namespace=pv \
            --kubeconfig=kubeconfig.yaml \
            --dry-run=client -o yaml | kubectl apply -f - --kubeconfig=kubeconfig.yaml

      - name: Update deployment image
        if: steps.changed.outputs.changed == 'true' && steps.deploy.outputs.has_kubeconfig == 'true' && matrix.deployment != ''
        run: |
          IMAGE=${{ matrix.image }}:${{ steps.vars.outputs.short_sha }}
          echo "Updating deployment/${{ matrix.deployment }} container/${{ matrix.container }} to $IMAGE"
          kubectl set image deployment/${{ matrix.deployment }} \
            ${{ matrix.container }}=$IMAGE \
            --namespace=pv \
            --kubeconfig=kubeconfig.yaml

      - name: Apply manifests
        if: (steps.changed.outputs.changed == 'true' || steps.changed.outputs.manifests_changed == 'true' || (matrix.name == 'pv-temporal-worker' && steps.changed.outputs.api_related_changed == 'true')) && steps.deploy.outputs.has_kubeconfig == 'true'
        run: |
          MANIFEST_DIR="${{ matrix.manifests_dir }}"
          if [ -d "$MANIFEST_DIR" ]; then
            echo "Applying manifests from: $MANIFEST_DIR"
          elif [ -d "${{ matrix.path }}/k8s" ]; then
            MANIFEST_DIR="${{ matrix.path }}/k8s"
            echo "Applying package manifests from: $MANIFEST_DIR"
          else
            echo "No manifests found for ${{ matrix.name }}; skipping kubectl apply"
            exit 0
          fi

          found_any=false
          for manifest in "$MANIFEST_DIR"/*.yaml; do
            [ -e "$manifest" ] || continue
            found_any=true
            filename=$(basename "$manifest")

            # Dependency-only worker run: apply runtime config, but do not re-apply
            # deployment spec because it is image-pinned and may roll back image set via CI.
            if [ "${{ matrix.name }}" = "pv-temporal-worker" ] && \
               [ "${{ steps.changed.outputs.changed }}" = "false" ] && \
               [ "${{ steps.changed.outputs.api_related_changed }}" = "true" ] && \
               [ "$filename" = "worker-deployment.yaml" ]; then
              echo "Skipping worker deployment manifest on API dependency-triggered run: $manifest"
              continue
            fi

            case "$filename" in
              *secret*.yaml|secrets.yaml)
                echo "Skipping secret manifest: $manifest"
                ;;
              *)
                echo "Applying manifest: $manifest"
                kubectl apply -f "$manifest" --kubeconfig=kubeconfig.yaml --namespace=pv
                ;;
            esac
          done

          if [ "$found_any" = false ]; then
            echo "No YAML manifests in $MANIFEST_DIR"
          fi

      - name: Verify Temporal task queue config
        if: (matrix.name == 'pv-api' || matrix.name == 'pv-temporal-worker') && steps.deploy.outputs.has_kubeconfig == 'true' && (steps.changed.outputs.changed == 'true' || steps.changed.outputs.manifests_changed == 'true' || (matrix.name == 'pv-temporal-worker' && steps.changed.outputs.api_related_changed == 'true'))
        run: |
          EXPECTED_QUEUE="pv-image-processing"

          if [ "${{ matrix.name }}" = "pv-api" ]; then
            ACTUAL_QUEUE=$(kubectl get configmap pv-api-config --namespace=pv --kubeconfig=kubeconfig.yaml -o jsonpath='{.data.TASK_QUEUE}')
            TARGET="configmap/pv-api-config"
          else
            ACTUAL_QUEUE=$(kubectl get configmap pv-worker-config --namespace=pv --kubeconfig=kubeconfig.yaml -o jsonpath='{.data.TASK_QUEUE}')
            TARGET="configmap/pv-worker-config"
          fi

          echo "${TARGET} TASK_QUEUE=${ACTUAL_QUEUE}"

          if [ "$ACTUAL_QUEUE" != "$EXPECTED_QUEUE" ]; then
            echo "::error::${TARGET} has TASK_QUEUE='${ACTUAL_QUEUE}', expected '${EXPECTED_QUEUE}'"
            exit 1
          fi

      - name: Rollout restart after secret/config updates
        if: steps.deploy.outputs.has_kubeconfig == 'true' && matrix.deployment != '' && (steps.changed.outputs.manifests_changed == 'true' || steps.runtime_app_secret.outcome == 'success' || (matrix.name == 'pv-temporal-worker' && steps.changed.outputs.api_related_changed == 'true'))
        run: |
          if kubectl get deployment/${{ matrix.deployment }} --namespace=pv --kubeconfig=kubeconfig.yaml >/dev/null 2>&1; then
            echo "Restarting deployment/${{ matrix.deployment }} to reload Secret/ConfigMap changes"
            kubectl rollout restart deployment/${{ matrix.deployment }} --namespace=pv --kubeconfig=kubeconfig.yaml
          else
            echo "Deployment ${{ matrix.deployment }} not found in namespace pv; skipping rollout restart"
          fi

      - name: Wait for rollout
        if: (steps.changed.outputs.changed == 'true' || steps.changed.outputs.manifests_changed == 'true' || (matrix.name == 'pv-temporal-worker' && steps.changed.outputs.api_related_changed == 'true')) && steps.deploy.outputs.has_kubeconfig == 'true' && matrix.deployment != ''
        run: |
          if kubectl get deployment/${{ matrix.deployment }} --namespace=pv --kubeconfig=kubeconfig.yaml >/dev/null 2>&1; then
            kubectl rollout status deployment/${{ matrix.deployment }} --namespace=pv --kubeconfig=kubeconfig.yaml --timeout=300s
          else
            echo "Deployment ${{ matrix.deployment }} not found in namespace pv; skipping rollout wait"
          fi

      - name: Report deployed image digest
        if: (steps.changed.outputs.changed == 'true' || steps.changed.outputs.manifests_changed == 'true' || (matrix.name == 'pv-temporal-worker' && steps.changed.outputs.api_related_changed == 'true')) && steps.deploy.outputs.has_kubeconfig == 'true' && matrix.deployment != ''
        run: |
          echo "Deployment image (spec):"
          kubectl get deployment/${{ matrix.deployment }} \
            --namespace=pv \
            --kubeconfig=kubeconfig.yaml \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="${{ matrix.container }}")].image}{"\n"}'

          echo "Running pod image digests:"
          kubectl get pods \
            --namespace=pv \
            --kubeconfig=kubeconfig.yaml \
            -l app=${{ matrix.deployment }} \
            -o 'custom-columns=NAME:.metadata.name,IMAGE_ID:.status.containerStatuses[0].imageID' \
            --no-headers || true

      - name: Cleanup
        if: always()
        run: rm -f kubeconfig.yaml || true
