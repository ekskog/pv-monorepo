apiVersion: apps/v1
kind: Deployment
metadata:
  name: pv-client
  namespace: pv
  labels:
    app: pv-client
    component: client
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: pv-client
  template:
    metadata:
      labels:
        app: pv-client
        component: client
      annotations:
        # This annotation will be updated by the CI/CD pipeline to force pod recreation
        deployment.kubernetes.io/revision: "1"
    spec:
      containers:
      - name: pv-client
        image: ghcr.io/ekskog/pv-client:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        # Explicit mappings (preferred) — pull specific keys from ConfigMap/Secret
        env:
        - name: VITE_API_URL
          valueFrom:
            secretKeyRef:
              name: pv-client-secrets
              key: VITE_API_URL
        - name: VITE_AUTH_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: pv-client-secrets
              key: VITE_AUTH_ENDPOINT
        - name: VITE_USER_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: pv-client-secrets
              key: VITE_USER_ENDPOINT
        - name: VITE_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: pv-client-secrets
              key: VITE_JWT_SECRET
        - name: VITE_DEBUG_MODE
          valueFrom:
            configMapKeyRef:
              name: pv-client-config
              key: VITE_DEBUG_MODE
        - name: VITE_LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: pv-client-config
              key: VITE_LOG_LEVEL
        # Load remaining keys from ConfigMap and Secret
        envFrom:
        - configMapRef:
            name: pv-client-config
        - secretRef:
            name: pv-client-secrets
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
            httpHeaders:
            - name: User-Agent
              value: "k8s-healthcheck"
          initialDelaySeconds: 30
          periodSeconds: 300
          timeoutSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
            httpHeaders:
            - name: User-Agent
              value: "k8s-healthcheck"
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
      restartPolicy: Always
