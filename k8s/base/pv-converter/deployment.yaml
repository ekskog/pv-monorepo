apiVersion: apps/v1
kind: Deployment
metadata:
  name: pv-avif-converter
  namespace: pv
  labels:
    app: pv-avif-converter
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pv-avif-converter
  template:
    metadata:
      labels:
        app: pv-avif-converter
    spec:
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "avif-converter"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3sa.freki.001
      containers:
        - name: pv-avif-converter
          image: ghcr.io/ekskog/pv-converter:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: pv-api-secret
          env:
            - name: MINIO_ENDPOINT
              value: "192.168.1.8:9000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"   # reduced from 1024Mi — 768Mi covers 48MP HEIC with margin
              cpu: "2000m"      # raised from 1000m — freki has 8 logical cores, give encoder room to breathe
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
            failureThreshold: 10
            successThreshold: 1