apiVersion: v1
kind: Secret
metadata:
  name: pv-frontend-secrets
  namespace: pv
  labels:
    app: pv-spa
    component: frontend
type: Opaque
data:
  # Base64 encoded values - replace with your actual production values
  # To encode: echo -n "your-value" | base64
  
  # API Configuration
  API_URL: aHR0cHM6Ly92YXVsdC1hcGkuZWtza29nLm5ldA==
  
  # Backend Authentication Endpoints
  AUTH_ENDPOINT: L2FwaS9hdXRoL2xvZ2lu  # /api/auth/login
  USER_ENDPOINT: L2FwaS91c2Vycw==      # /api/users

  # JWT Configuration (if needed)
  JWT_SECRET: eW91ci1qd3Qtc2VjcmV0LWtleS1oZXJl  # your-jwt-secret-key-here
  
  # Optional: Additional security settings
  SESSION_TIMEOUT: ODY0MDA=  # 86400 (24 hours in seconds)
  API_TIMEOUT: MzAwMDA=      # 30000 (30 seconds in milliseconds)
