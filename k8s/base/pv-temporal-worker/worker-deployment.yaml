apiVersion: apps/v1
kind: Deployment
metadata:
  name: pv-worker
  namespace: pv
  labels:
    app: pv-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pv-worker
  template:
    metadata:
      labels:
        app: pv-worker
    spec:
      hostAliases:
      - ip: "192.168.1.8"
        hostnames:
        - "mjolnir"
      containers:
      - name: worker
        image: ghcr.io/ekskog/pv-worker:main-5e0bb1e
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: pv-worker-config
        - secretRef:
          name: pv-api-secret
        volumeMounts:
        - name: nfs-storage
          mountPath: /nfs-storage
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: nfs-storage
        persistentVolumeClaim:
          claimName: nfs-pv-claim
